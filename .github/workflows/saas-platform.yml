name: SaaS Platform CI

on:
  push:
    branches:
      - main
    paths:
      - "saas/jobflow/app/**"
      - "saas/jobflow/backend/**"
      - "saas/jobflow/nginx/**"
      - "saas/jobflow/staging/**"
      - "saas/jobflow/scripts/**"
      - "saas/jobflow/security/**"
      - "saas/jobflow/docs/security/**"
      - "saas/jobflow/systemd/**"
      - "saas/jobflow/docker-compose.yml"
      - "saas/jobflow/docs/developer/**"
      - "saas/jobflow/docs/deployment/**"
      - "saas/jobflow/docs/recovery/**"
      - ".github/workflows/saas-platform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "saas/jobflow/app/**"
      - "saas/jobflow/backend/**"
      - "saas/jobflow/nginx/**"
      - "saas/jobflow/staging/**"
      - "saas/jobflow/scripts/**"
      - "saas/jobflow/security/**"
      - "saas/jobflow/docs/security/**"
      - "saas/jobflow/systemd/**"
      - "saas/jobflow/docker-compose.yml"
      - "saas/jobflow/docs/developer/**"
      - "saas/jobflow/docs/deployment/**"
      - "saas/jobflow/docs/recovery/**"
      - ".github/workflows/saas-platform.yml"

permissions:
  contents: read

jobs:
  nginx-security-headers:
    name: Nginx Security Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Pull Nginx test image
        run: docker pull nginx:1.31.3-alpine

      - name: Verify hostname-scoped security headers
        run: python -B saas/jobflow/scripts/tests/test_nginx_security_headers.py

  product-contract:
    name: Product Contract Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: saas/jobflow/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: saas/jobflow/backend/pyproject.toml

      - name: Install platform
        run: python -m pip install --editable .

      - name: Validate installed products
        run: saas-validate-product

      - name: Validate generated product round trip
        run: |
          factory_root="$(mktemp -d)"

          saas-create-product \
            factory-proof \
            "Factory Proof" \
            --description "CI product factory proof." \
            --with-resource record \
            --root "$factory_root"

          saas-validate-product \
            factory-proof \
            --root "$factory_root"

      - name: Validate installed standalone plugin
        run: |
          plugin_root="$(mktemp -d)"

          saas-create-product \
            external-proof \
            "External Proof" \
            --description "Installed plugin packaging proof." \
            --with-resource record \
            --standalone \
            --root "$plugin_root"

          python -m pip install \
            --no-deps \
            "$plugin_root/external-proof-product"

          cd /tmp
          saas-validate-product external-proof

      - name: Validate platform release wheel
        run: |
          release_root="$(mktemp -d)"

          python -m pip wheel \
            --no-deps \
            --wheel-dir "$release_root/wheels" \
            .

          platform_wheel="$(
            find "$release_root/wheels" \
              -maxdepth 1 \
              -name 'jobflow_saas_platform-*.whl' \
              -print \
              | head -1
          )"

          python -m venv "$release_root/venv"

          "$release_root/venv/bin/python" \
            -m pip install \
            "$platform_wheel"

          cd /tmp
          "$release_root/venv/bin/saas-validate-product"

  backend-tests:
    name: Backend Tests and Migration Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: saas/jobflow/backend

    env:
      POSTGRES_PASSWORD: jobflow-ci-test-password
      DATABASE_URL: postgresql+psycopg://jobflow:jobflow-ci-test-password@127.0.0.1:5433/jobflow_test
      JWT_SECRET: jobflow-ci-jwt-secret-at-least-32-bytes

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobflow_test
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow-ci-test-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobflow -d jobflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: saas/jobflow/backend/pyproject.toml

      - name: Install platform and test dependencies
        run: python -m pip install --editable ".[test]"

      - name: Apply platform migrations
        run: python scripts/platform_alembic.py upgrade head

      - name: Run backend test suite
        run: pytest -q

      - name: Check migration drift
        run: python scripts/platform_alembic.py check

  backup-tests:
    name: Backup and Restore Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: saas/jobflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check backup shell syntax
        run: bash -n scripts/backup-jobflow-db.sh

      - name: Run backup and restore unit tests
        run: python -B -m unittest discover -s scripts/tests -p 'test_backup*.py' -v

      - name: Run readiness monitor tests
        run: python -B -m unittest discover -s scripts/tests -p 'test_readiness_monitor.py' -v

  security-scanning:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test container finding policy
        run: >-
          python -B -m unittest
          saas/jobflow/scripts/tests/test_container_security_policy.py
          -v

      - name: Scan dependencies, secrets and images
        run: saas/jobflow/scripts/run-security-scans.sh
