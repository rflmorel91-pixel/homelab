<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RenewalDesk | Never Miss a Renewal</title>

  <meta
    name="description"
    content="RenewalDesk helps businesses track licenses, insurance, certifications, contracts, and recurring renewal deadlines."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px;
    }

    nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 7px;
      background: white;
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(40px, 7vw, 68px);
      line-height: 1.05;
    }

    .lead {
      max-width: 700px;
      margin: 0 auto 32px;
      color: #4b5563;
      font-size: 20px;
    }

    .primary {
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <nav>
    <a class="brand" href="/renewaldesk">
      RenewalDesk
    </a>

    <a class="button" href="/renewaldesk/app">
      Open Workspace
    </a>
  </nav>
</header>

<main>
  <h1>Never miss an important renewal.</h1>

  <p class="lead">
    Track licenses, insurance policies,
    certifications, contracts, and other
    recurring deadlines in one place.
  </p>

  <a
    class="button primary"
    href="/renewaldesk/app"
  >
    Open RenewalDesk
  </a>
</main>

</body>
</html>
