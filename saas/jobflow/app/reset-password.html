<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="referrer"
    content="no-referrer"
  >
  <title>Reset Password | FieldLookers</title>

  <link rel="stylesheet" href="/assets/client-access-30352e9eeb2c.css">
</head>

<body>
  <main class="shell">
    <div class="brand">
      <strong>FieldLookers</strong>
      <span>Secure platform password recovery</span>
    </div>

    <section class="card">
      <h1>Reset your password</h1>

      <p class="intro">
        Choose a new password for your account.
      </p>

      <form id="resetForm">
        <label>
          Password
          <input
            id="password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </label>

        <label>
          Confirm new password
          <input
            id="passwordConfirmation"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </label>

        <button
          id="resetButton"
          type="submit"
        >
          Reset Password
        </button>
      </form>

      <div
        id="resetStatus"
        class="status"
        role="status"
      ></div>

      <a
        id="continueLink"
        class="continue-link"
        href="/"
      >
        Continue
      </a>

      <p class="help">
        Reset links are single-use and expire after 30 minutes.
        Request a new reset link if this one has expired.
      </p>
    </section>
  </main>

  <script src="/assets/reset-password-2258733150ce.js"></script>
</body>
</html>
