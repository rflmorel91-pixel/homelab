<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="referrer"
    content="no-referrer"
  >
  <title>Reset Password | FieldLookers</title>

  <style>
    :root {
      --background: #f8fafc;
      --surface: #ffffff;
      --border: #dbe3ec;
      --text: #172033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #166534;
      --success-bg: #f0fdf4;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top,
          #dbeafe 0,
          var(--background) 42%
        );
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .shell {
      width: min(100%, 480px);
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    .brand strong {
      display: block;
      font-size: 25px;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      outline: 3px solid #dbeafe;
      border-color: var(--primary);
    }

    button,
    .continue-link {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .continue-link:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.visible {
      display: block;
    }

    .status.error {
      border: 1px solid #fecaca;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .status.success {
      border: 1px solid #bbf7d0;
      background: var(--success-bg);
      color: var(--success);
    }

    .continue-link {
      display: none;
      margin-top: 16px;
    }

    .continue-link.visible {
      display: block;
    }

    .help {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="shell">
    <div class="brand">
      <strong>FieldLookers</strong>
      <span>Secure platform password recovery</span>
    </div>

    <section class="card">
      <h1>Reset your password</h1>

      <p class="intro">
        Choose a new password for your account.
      </p>

      <form id="resetForm">
        <label>
          Password
          <input
            id="password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </label>

        <label>
          Confirm new password
          <input
            id="passwordConfirmation"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </label>

        <button
          id="resetButton"
          type="submit"
        >
          Reset Password
        </button>
      </form>

      <div
        id="resetStatus"
        class="status"
        role="status"
      ></div>

      <a
        id="continueLink"
        class="continue-link"
        href="/"
      >
        Continue
      </a>

      <p class="help">
        Reset links are single-use and expire after 30 minutes.
        Request a new reset link if this one has expired.
      </p>
    </section>
  </main>

  <script>
    "use strict";

    const API_BASE = "/api/v1";
    const hash = new URLSearchParams(
      window.location.hash.slice(1)
    );
    const resetToken = hash.get("token") || "";

    window.history.replaceState(
      null,
      "",
      window.location.pathname
    );

    const form =
      document.getElementById("resetForm");

    const statusElement =
      document.getElementById("resetStatus");

    const resetButton =
      document.getElementById("resetButton");

    const continueLink =
      document.getElementById("continueLink");


    function showStatus(message, type) {
      statusElement.textContent = message;
      statusElement.className =
        `status visible ${type}`;
    }


    if (!resetToken) {
      form.classList.add("hidden");

      showStatus(
        "This reset link is missing or invalid. Request a new link.",
        "error"
      );
    }


    form.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        const password =
          document.getElementById("password").value;

        const confirmation =
          document.getElementById(
            "passwordConfirmation"
          ).value;

        if (password !== confirmation) {
          showStatus(
            "Passwords do not match.",
            "error"
          );
          return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "Resetting...";

        try {
          const response = await fetch(
            `${API_BASE}/auth/password-reset/confirm`,
            {
              method: "POST",
              credentials: "same-origin",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                token: resetToken,
                password,
              }),
            }
          );

          if (!response.ok) {
            let detail =
              `Password reset failed (${response.status})`;

            try {
              const payload = await response.json();

              if (payload.detail) {
                detail = payload.detail;
              }
            } catch {
              // Keep fallback error.
            }

            throw new Error(detail);
          }

          const payload =
            await response.json();

          form.reset();
          form.classList.add("hidden");

          const workspaceUrl =
            `${payload.product.workspace_route}?password_reset=1`;

          continueLink.href = workspaceUrl;

          continueLink.textContent =
            `Continue to Sign In`;

          continueLink.classList.add("visible");

          showStatus(
            `Password updated. Redirecting to ${payload.product.name} sign in...`,
            "success"
          );

          window.setTimeout(
            () => window.location.assign(workspaceUrl),
            1200
          );

        } catch (error) {
          showStatus(
            error.message,
            "error"
          );

          resetButton.disabled = false;
          resetButton.textContent = "Reset Password";
        }
      }
    );
  </script>
</body>
</html>
