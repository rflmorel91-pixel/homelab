<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SaaS Commercialization</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1f2937;
      line-height: 1.5;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 24px;
    }

    .header-inner,
    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .button {
      display: inline-block;
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      background: #111827;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .button-light {
      background: white;
      color: #111827;
    }

    main {
      padding: 36px 24px 80px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading h1 {
      margin: 0 0 8px;
    }

    .page-heading p {
      margin: 0;
      color: #6b7280;
    }

    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel h2 {
      margin-top: 0;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 18px;
      margin-top: 14px;
    }

    .card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      border-radius: 999px;
      padding: 5px 10px;
      background: #f3f4f6;
      font-size: 13px;
      font-weight: bold;
    }

    .lead-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .lead-actions button {
      border: 0;
      border-radius: 7px;
      padding: 9px 13px;
      background: #111827;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      color: #6b7280;
    }

    .error {
      color: #991b1b;
      font-weight: bold;
    }

    .meta {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">SaaS Commercialization</div>
      <div class="meta">Pilot acquisition and customer development</div>
    </div>

    <a class="button button-light" href="/admin">
      Platform Administration
    </a>
  </div>
</header>

<main>
  <div class="page-heading">
    <h1>Pilot Leads</h1>
    <p>
      Prospective customers interested in using our SaaS products.
    </p>
  </div>

  <section class="panel">
    <div id="operatorStatus" class="meta">
      Checking operator access...
    </div>

    <div style="margin: 16px 0;">
      <label for="productFilter">
        <strong>Product</strong>
      </label>

      <select id="productFilter">
        <option value="">All Products</option>
      </select>
    </div>

    <div id="leadList">
      <p class="empty">Loading leads...</p>
    </div>
  </section>
</main>

<script>
  const API_BASE = "/api/v1";

  const tenantId =
    localStorage.getItem("jobflow_tenant_id");

  const operatorStatus =
    document.getElementById("operatorStatus");

  const leadList =
    document.getElementById("leadList");

  const productFilter =
    document.getElementById("productFilter");

  let provisioningOwners = [];
  let operatorLeads = [];


  async function apiRequest(path, options = {}) {
    const headers = {
      ...(options.headers || {})
    };

    if (tenantId) {
      headers["X-Tenant-ID"] = tenantId;
    }

    const response = await fetch(
      `${API_BASE}${path}`,
      {
        ...options,
        credentials: "same-origin",
        headers
      }
    );

    if (!response.ok) {
      let detail = `Request failed (${response.status})`;

      try {
        const data = await response.json();

        if (data.detail) {
          detail = data.detail;
        }
      } catch {
        // Keep default error.
      }

      if (response.status === 401) {
        const returnTo =
          encodeURIComponent("/commercialization");

        window.location.href =
          `/admin?return=${returnTo}`;

        throw new Error(
          "Session expired. Sign in again to continue."
        );
      }

      throw new Error(detail);
    }

    return response.json();
  }


  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function slugify(value) {
    return String(value)
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }


  function formatStatus(status) {
    const labels = {
      new: "New",
      contacted: "Contacted",
      qualified: "Qualified",
      converted: "Converted",
      closed: "Closed"
    };

    return labels[status] || status;
  }


  function renderLeads(leads) {
    if (leads.length === 0) {
      leadList.innerHTML =
        '<p class="empty">No pilot leads yet.</p>';
      return;
    }

    leadList.innerHTML = leads.map(lead => {
      const submitted =
        new Date(lead.created_at).toLocaleString();

      const actions = {
        new: [
          ["contacted", "Mark Contacted"]
        ],
        contacted: [
          ["qualified", "Mark Qualified"],
          ["closed", "Close Lead"]
        ],
        qualified: [
          ["closed", "Close Lead"]
        ],
        converted: [],
        closed: []
      }[lead.status] || [];

      const actionButtons = actions.map(
        ([status, label]) => `
          <button
            onclick="updateLeadStatus(${lead.id}, '${status}')"
          >
            ${label}
          </button>
        `
      ).join("");

      const acceptedOwner =
        provisioningOwners.find(
          owner => owner.lead_id === lead.id
        );

      const provisioning =
        lead.status === "qualified"
          ? `
            <div class="lead-actions">
              <strong>Provision Client</strong>

              ${
                acceptedOwner
                  ? `
                    <div style="margin-top: 8px;">
                      <strong>Accepted Owner</strong>

                      <div>
                        ${escapeHtml(
                          acceptedOwner.display_name
                        )}
                        ·
                        ${escapeHtml(
                          acceptedOwner.email
                        )}
                      </div>
                    </div>

                    <div style="margin-top: 8px;">
                      <input
                        id="slug-${lead.id}"
                        type="text"
                        value="${escapeHtml(
                          slugify(lead.business_name)
                        )}"
                        placeholder="client-workspace-slug"
                      >
                    </div>

                    <div style="margin-top: 8px;">
                      <button
                        onclick="provisionLead(${lead.id})"
                      >
                        Provision Client
                      </button>
                    </div>
                  `
                  : `
                    <div class="meta" style="margin-top: 8px;">
                      Awaiting owner activation. Create and
                      accept the lead invitation before
                      provisioning this client.
                    </div>
                  `
              }
            </div>
          `
          : "";

      const legacyConverted =
        lead.status === "converted"
        && !lead.converted_tenant_id
          ? `
            <div class="lead-actions">
              <strong>
                Legacy conversion requires reconciliation
              </strong>

              <div class="meta">
                This lead was marked converted before tenant
                provisioning was enforced.
              </div>

              <div style="margin-top: 8px;">
                <button
                  onclick="reopenLegacyConversion(${lead.id})"
                >
                  Reopen for Provisioning
                </button>
              </div>
            </div>
          `
          : "";

      const converted =
        lead.status === "converted"
        && lead.converted_tenant_id
          ? `
            <div class="lead-actions">
              <strong>
                ${
                  lead.converted_client_number
                    ? `Client #${lead.converted_client_number}`
                    : "Validation Workspace"
                }
              </strong>

              <div>
                ${escapeHtml(lead.business_name)}
              </div>

              <div class="meta">
                ${
                  lead.converted_client_number
                    ? `${escapeHtml(lead.product_name)} client`
                    : `Internal Workspace #${lead.converted_tenant_id}`
                }
              </div>

              ${
                lead.converted_at
                  ? `
                    <div class="meta">
                      Provisioned:
                      ${escapeHtml(
                        new Date(
                          lead.converted_at
                        ).toLocaleString()
                      )}
                    </div>
                  `
                  : ""
              }

              <div style="margin-top: 8px;">
                <a
                  href="/admin?tenant=${lead.converted_tenant_id}"
                >
                  ${
                    lead.converted_client_number
                      ? "Manage Client"
                      : "Manage Workspace"
                  }
                </a>
              </div>
            </div>
          `
          : "";

      return `
        <div class="card">
          <strong>${escapeHtml(lead.business_name)}</strong>

          <div class="meta">
            Product:
            ${escapeHtml(lead.product_name)}
            (${escapeHtml(lead.product_slug)})
          </div>

          <div>
            Contact: ${escapeHtml(lead.contact_name)}
          </div>

          <div>
            Email: ${escapeHtml(lead.email)}
          </div>

          ${
            lead.phone
              ? `<div>Phone: ${escapeHtml(lead.phone)}</div>`
              : ""
          }

          <div>
            Service: ${escapeHtml(lead.service_type)}
          </div>

          ${
            lead.message
              ? `<div>${escapeHtml(lead.message)}</div>`
              : ""
          }

          <div class="meta">
            Submitted: ${escapeHtml(submitted)}
          </div>

          <span class="status">
            ${escapeHtml(formatStatus(lead.status))}
          </span>

          ${
            actionButtons
              ? `<div class="lead-actions">${actionButtons}</div>`
              : ""
          }

          ${provisioning}
          ${legacyConverted}
          ${converted}
        </div>
      `;
    }).join("");
  }


  async function updateLeadStatus(
    leadId,
    newStatus
  ) {
    try {
      await apiRequest(`/leads/${leadId}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: newStatus
        })
      });

      await loadOperatorLeads();

    } catch (error) {
      operatorStatus.textContent = error.message;
      operatorStatus.className = "error";
    }
  }


  async function reopenLegacyConversion(leadId) {
    if (
      !window.confirm(
        "Reopen this legacy converted lead for proper tenant provisioning?"
      )
    ) {
      return;
    }

    try {
      operatorStatus.textContent =
        "Reopening legacy conversion...";

      await apiRequest(
        `/leads/${leadId}/reopen-conversion`,
        {
          method: "POST"
        }
      );

      operatorStatus.textContent =
        "Lead reopened for provisioning.";

      operatorStatus.className = "";

      await loadOperatorLeads();

    } catch (error) {
      operatorStatus.textContent = error.message;
      operatorStatus.className = "error";
    }
  }


  async function provisionLead(leadId) {
    const acceptedOwner =
      provisioningOwners.find(
        owner => owner.lead_id === leadId
      );

    const slugInput =
      document.getElementById(`slug-${leadId}`);

    if (!acceptedOwner) {
      operatorStatus.textContent =
        "The lead owner must activate their account before provisioning.";

      operatorStatus.className = "error";
      return;
    }

    if (!slugInput) {
      operatorStatus.textContent =
        "Client provisioning is unavailable.";

      operatorStatus.className = "error";
      return;
    }

    const tenantSlug =
      slugInput.value.trim();

    if (!tenantSlug) {
      operatorStatus.textContent =
        "Client workspace slug is required.";

      operatorStatus.className = "error";
      return;
    }

    if (
      !window.confirm(
        "Provision this qualified lead as a client?"
      )
    ) {
      return;
    }

    try {
      operatorStatus.textContent =
        "Provisioning client...";

      await apiRequest(
        `/leads/${leadId}/provision`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            owner_user_id:
              acceptedOwner.user_id,
            tenant_slug: tenantSlug
          })
        }
      );

      operatorStatus.textContent =
        "Client provisioned successfully.";

      operatorStatus.className = "";

      await loadOperatorLeads();

    } catch (error) {
      operatorStatus.textContent = error.message;
      operatorStatus.className = "error";
    }
  }


  async function loadOperatorLeads() {
    try {
      const [
        leads,
        provisioningOptions
      ] = await Promise.all([
        apiRequest("/leads/"),
        apiRequest("/leads/provisioning-options")
      ]);

      provisioningOwners =
        provisioningOptions.owners;

      operatorLeads = leads;

      const products = Array.from(
        new Map(
          leads.map(lead => [
            lead.product_slug,
            lead.product_name
          ])
        ).entries()
      ).sort(
        (a, b) => a[1].localeCompare(b[1])
      );

      productFilter.innerHTML = `
        <option value="">All Products</option>
        ${
          products.map(([slug, name]) => `
            <option value="${escapeHtml(slug)}">
              ${escapeHtml(name)}
            </option>
          `).join("")
        }
      `;

      operatorStatus.textContent =
        "Platform operator access verified.";

      renderLeads(operatorLeads);

    } catch (error) {
      operatorStatus.textContent = error.message;
      operatorStatus.className = "error";

      leadList.innerHTML =
        '<p class="empty">Lead data is unavailable.</p>';
    }
  }


  productFilter.addEventListener(
    "change",
    () => {
      const selected = productFilter.value;

      renderLeads(
        selected
          ? operatorLeads.filter(
              lead => lead.product_slug === selected
            )
          : operatorLeads
      );
    }
  );


  loadOperatorLeads();
</script>

</body>
</html>
