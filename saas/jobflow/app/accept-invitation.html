<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta
    name="referrer"
    content="no-referrer"
  >
  <title>Activate Account | FieldLookers</title>

  <link rel="stylesheet" href="/assets/client-access-30352e9eeb2c.css">
</head>

<body>
  <main class="shell">
    <div class="brand">
      <strong>FieldLookers</strong>
      <span>Secure platform account activation</span>
    </div>

    <section class="card">
      <h1>Activate your account</h1>

      <p class="intro">
        Choose a password to activate your shared platform account.
      </p>

      <form id="activationForm">
        <label>
          Password
          <input
            id="password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </label>

        <label>
          Confirm password
          <input
            id="passwordConfirmation"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required
          >
        </label>

        <button
          id="activateButton"
          type="submit"
        >
          Activate Account
        </button>
      </form>

      <div
        id="activationStatus"
        class="status"
        role="status"
      ></div>

      <a
        id="continueLink"
        class="continue-link"
        href="/"
      >
        Continue
      </a>

      <p class="help">
        Invitation links are single-use and expire after 72 hours.
        Contact your platform operator if this link has expired.
      </p>
    </section>
  </main>

  <script src="/assets/accept-invitation-f0f3c6a68515.js"></script>
</body>
</html>
