map $http_cf_connecting_ip $jobflow_client_ip {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

# Issue #19: host-only HSTS canary, observed by browsers over public HTTPS.
# Cloudflare terminates TLS; origin $scheme is HTTP. Do not gate on it.
# No includeSubDomains or preload. Increase only after rollout verification.
map $host $jobflow_hsts {
    default                     "";
    jobflow.fieldlookers.com     "max-age=300";
}

# Issue #19: enforce only the seven approved documents on this host.
# Match the original request path so unknown index fallbacks remain Report-Only.
# Direct HTML, approved aliases and query strings share the intended policy.
# Other hosts, unknown fallback pages and unfinished JobFlow remain Report-Only.
map $host $jobflow_public_csp_policy {
    default "";
    jobflow.fieldlookers.com "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
}

map $request_uri $jobflow_public_csp {
    default "";
    ~^/(?:index\.html)?(?:\?.*)?$ $jobflow_public_csp_policy;
    ~^/request(?:\.html|/[^/?]+/?)(?:\?.*)?$ $jobflow_public_csp_policy;
    ~^/reset-password(?:\.html)?(?:\?.*)?$ $jobflow_public_csp_policy;
    ~^/accept-invitation(?:\.html)?(?:\?.*)?$ $jobflow_public_csp_policy;
    ~^/renewaldesk(?:-app\.html|/app)(?:\?.*)?$ $jobflow_public_csp_policy;
    ~^/renewaldesk(?:\.html)?(?:\?.*)?$ $jobflow_public_csp_policy;
    ~^/workflow-automation(?:\.html)?(?:\?.*)?$ $jobflow_public_csp_policy;
}

map $host $saas_root_file {
    default                         /index.html;
    renewaldesk.fieldlookers.com    /renewaldesk.html;
}

limit_req_zone $jobflow_client_ip zone=jobflow_login:10m rate=5r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_public_request:10m rate=10r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_public_lead:10m rate=5r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_invitation_accept:10m rate=10r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_password_reset:10m rate=3r/m;

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Report-Only remains everywhere; enforcement is limited by the maps above.
    # Inspect browser console violations during controlled testing.
    # No remote report collector or source-code samples configured.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $jobflow_hsts always;
    add_header Content-Security-Policy $jobflow_public_csp always;

    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/auth/login {
        limit_req zone=jobflow_login burst=3 nodelay;

        proxy_pass http://jobflow-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location = /api/v1/auth/invitations/accept {
        limit_req zone=jobflow_invitation_accept burst=5 nodelay;

        proxy_pass http://jobflow-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/auth/password-reset/(request|confirm)$ {
        limit_req zone=jobflow_password_reset burst=3 nodelay;

        proxy_pass http://jobflow-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ~ ^/api/v1/public/products/[^/]+/leads$ {
        limit_req zone=jobflow_public_lead burst=3 nodelay;

        proxy_pass http://jobflow-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/public/tenants/[^/]+/requests$ {
        limit_req zone=jobflow_public_request burst=5 nodelay;

        proxy_pass http://jobflow-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://jobflow-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/request/[^/]+/?$ {
        try_files /request.html =404;
    }


    location = /reset-password {
        try_files /reset-password.html =404;
    }


    location = /accept-invitation {
        try_files /accept-invitation.html =404;
    }

    location = /app {
        try_files /app.html =404;
    }

    location = /workflow-automation {
        try_files /workflow-automation.html =404;
    }

    location = /renewaldesk {
        try_files /renewaldesk.html =404;
    }

    location = /renewaldesk/app {
        try_files /renewaldesk-app.html =404;
    }

    location = /commercialization {
        try_files /commercialization.html =404;
    }

    location = /prospecting {
        try_files /prospecting.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = / {
        try_files $saas_root_file =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
