name: jobflow

services:

  jobflow-api:
    build:
      context: ./backend
    container_name: jobflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://jobflow:${POSTGRES_PASSWORD}@jobflow-db:5432/jobflow
      JWT_SECRET: ${JWT_SECRET}
      RENEWALDESK_SMTP_HOST: ${RENEWALDESK_SMTP_HOST:-}
      RENEWALDESK_SMTP_PORT: ${RENEWALDESK_SMTP_PORT:-587}
      RENEWALDESK_SMTP_USERNAME: ${RENEWALDESK_SMTP_USERNAME:-}
      RENEWALDESK_SMTP_PASSWORD: ${RENEWALDESK_SMTP_PASSWORD:-}
      RENEWALDESK_SMTP_FROM_EMAIL: ${RENEWALDESK_SMTP_FROM_EMAIL:-}
      RENEWALDESK_SMTP_USE_TLS: ${RENEWALDESK_SMTP_USE_TLS:-true}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      jobflow-migrate:
        condition: service_completed_successfully
  jobflow-migrate:
    build:
      context: ./backend
    container_name: jobflow-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://jobflow:${POSTGRES_PASSWORD}@jobflow-db:5432/jobflow
      JWT_SECRET: ${JWT_SECRET}
    command:
      - python
      - scripts/platform_alembic.py
      - upgrade
      - head
    depends_on:
      jobflow-db:
        condition: service_healthy
    restart: "no"

  jobflow-db:
    image: postgres:16
    container_name: jobflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobflow
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jobflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U jobflow -d jobflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  jobflow-web:
    image: nginx:alpine
    container_name: jobflow-web
    restart: unless-stopped
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      jobflow-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  jobflow_postgres_data:
