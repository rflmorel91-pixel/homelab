# STAGING ONLY: never replace production configuration with this file.
# Match the final served document after try_files, not only the incoming alias.
# Unknown resources and unfinished JobFlow do not receive enforcement.
map $uri $fieldlookers_preview_csp {
    default "";
    /index.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /renewaldesk.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /workflow-automation.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /request.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /reset-password.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /accept-invitation.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /renewaldesk-app.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /commercialization.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /prospecting.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
    /admin.html "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'";
}

map $http_cf_connecting_ip $jobflow_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $host $saas_root_file {
    default                         /index.html;
    renewaldesk.fieldlookers.com    /renewaldesk.html;
}

limit_req_zone $jobflow_client_ip zone=jobflow_login:10m rate=5r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_public_request:10m rate=10r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_public_lead:10m rate=5r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_invitation_accept:10m rate=10r/m;
limit_req_zone $jobflow_client_ip zone=jobflow_password_reset:10m rate=3r/m;

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/staging/server.crt;
    ssl_certificate_key /etc/nginx/staging/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    server_tokens off;
    add_header X-FieldLookers-Environment "staging" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Issue #19: observation only; not enforced CSP protection.
    # Inspect browser console violations during controlled testing.
    # No remote report collector or source-code samples configured.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'none'" always;
    # Enforced in the isolated preview only; Report-Only is retained everywhere.
    add_header Content-Security-Policy $fieldlookers_preview_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    limit_req_status 429;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/auth/login {
        limit_req zone=jobflow_login burst=3 nodelay;

        proxy_pass http://staging-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location = /api/v1/auth/invitations/accept {
        limit_req zone=jobflow_invitation_accept burst=5 nodelay;

        proxy_pass http://staging-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/auth/password-reset/(request|confirm)$ {
        limit_req zone=jobflow_password_reset burst=3 nodelay;

        proxy_pass http://staging-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    location ~ ^/api/v1/public/products/[^/]+/leads$ {
        limit_req zone=jobflow_public_lead burst=3 nodelay;

        proxy_pass http://staging-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/public/tenants/[^/]+/requests$ {
        limit_req zone=jobflow_public_request burst=5 nodelay;

        proxy_pass http://staging-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $jobflow_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://staging-api:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/request/[^/]+/?$ {
        try_files /request.html =404;
    }


    location = /reset-password {
        try_files /reset-password.html =404;
    }


    location = /accept-invitation {
        try_files /accept-invitation.html =404;
    }

    location = /app {
        try_files /app.html =404;
    }

    location = /workflow-automation {
        try_files /workflow-automation.html =404;
    }

    location = /renewaldesk {
        try_files /renewaldesk.html =404;
    }

    location = /renewaldesk/app {
        try_files /renewaldesk-app.html =404;
    }

    location = /commercialization {
        try_files /commercialization.html =404;
    }

    location = /prospecting {
        try_files /prospecting.html =404;
    }

    location = /admin {
        try_files /admin.html =404;
    }

    location = / {
        try_files $saas_root_file =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The gateway is the only staging service with an ingress network.
# Mailpit itself retains internal-only networking and no published ports.
map $http_upgrade $staging_mail_connection {
    default upgrade;
    "" close;
}

server {
    listen 8025;
    server_name _;
    server_tokens off;
    add_header X-FieldLookers-Environment "staging-mail" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://staging-mail:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $staging_mail_connection;
        proxy_set_header Cookie "";
    }
}
